<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c1d35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="福岡聖誕叮叮噹">
  <title>2026 福岡聖誕叮叮噹</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="更多">☰</button>
      <div class="top-title" id="pageTitle">首頁</div>
      <button id="bellBtn" class="icon-btn" aria-label="提醒">🔔</button>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home"><span>⌂</span><small>首頁</small></button>
      <button class="nav-item" data-page="itinerary"><span>▣</span><small>行程</small></button>
      <button class="nav-item" data-page="map"><span>⌖</span><small>地圖</small></button>
      <button class="nav-item" data-page="favorites"><span>♡</span><small>收藏</small></button>
      <button class="nav-item" data-page="more"><span>☰</span><small>更多</small></button>
    </nav>
  </div>

  <dialog id="modal">
    <div class="modal-card">
      <button id="modalClose" class="modal-close">✕</button>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
