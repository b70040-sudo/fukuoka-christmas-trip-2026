<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6f3cc3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="福岡聖誕旅" />
  <title>福岡・博多聖誕市集之旅</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="選單">☰</button>
      <div class="topbar-title" id="pageTitle">首頁</div>
      <button class="icon-btn" id="notifyBtn" aria-label="提醒">🔔</button>
    </header>

    <main id="mainContent"></main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button data-page="home" class="nav-item active"><span>⌂</span><small>首頁</small></button>
      <button data-page="itinerary" class="nav-item"><span>▣</span><small>行程</small></button>
      <button data-page="map" class="nav-item"><span>⌖</span><small>地圖</small></button>
      <button data-page="favorites" class="nav-item"><span>♡</span><small>收藏</small></button>
      <button data-page="more" class="nav-item"><span>☰</span><small>更多</small></button>
    </nav>
  </div>

  <dialog id="modal">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
